spring.application.name=anime-list-backend
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=${PORT:8080}

spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.sslmode=require

anilist.api.url=https://graphql.anilist.co
anilist.api.connect-timeout=5s
anilist.api.read-timeout=15s
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
anilist.oauth.client-id=${ANILIST_CLIENT_ID:}
anilist.oauth.client-secret=${ANILIST_CLIENT_SECRET:}
anilist.oauth.redirect-uri=${ANILIST_REDIRECT_URI:http://localhost:8080/api/auth/callback}
app.cookie-secure=${COOKIE_SECURE:true}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
