name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:
    inputs:
      configure_domains:
        description: Attach the production custom domains after DNS delegation
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: npm run lint && npm run test:unit && npm run build:cloudflare

      - name: Deploy production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 90a1f845b76eeb52896a4f405b509930
          workingDirectory: frontend
          command: pages deploy dist --project-name=anirecord --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach production domains
        if: github.event_name == 'workflow_dispatch' && inputs.configure_domains
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90a1f845b76eeb52896a4f405b509930
          CLOUDFLARE_PAGES_PROJECT: anirecord
          CLOUDFLARE_PAGES_DOMAINS: anirecord.com.ar,www.anirecord.com.ar
        run: node scripts/configure-cloudflare-domains.mjs
